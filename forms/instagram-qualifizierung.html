<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Schmerzfrei-Check</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Design-Tokens der MyBodyMind-Seiten (mbmkompass.mybodymind.de) */
  :root{
    --bg:#FFFFFF; --cream:#F5F2EA; --soft:#EBF0EC; --ink:#26403F; --text:#465B5A; --muted:#71837F;
    --petrol:#446B70; --petrol-deep:#35565A; --brand:#6C8F95; --brand-deep:#527379;
    --gold:#F3C647; --gold-deep:#DBA92A; --gold-light:#F6D165; --line:#DBE5E0;
    --radius:20px; --shadow:0 6px 24px rgba(38,64,63,.07); --shadow-lg:0 16px 44px rgba(38,64,63,.11);
    --head:'Plus Jakarta Sans',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{margin:0; background:var(--cream); color:var(--text); font-family:var(--body); font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit; color:inherit}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px}

  .app{max-width:640px; margin:0 auto; padding:0 16px; padding-block:16px 110px; display:flex; flex-direction:column; gap:16px}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--head); font-weight:800; color:var(--ink); font-size:14px; letter-spacing:.01em}
  .brand img{width:34px; height:34px; border-radius:9px; display:block}
  .stepinfo{font-size:13px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .progress{height:6px; border-radius:999px; background:var(--line); overflow:hidden}
  .progress > span{display:block; height:100%; width:0; background:var(--petrol); border-radius:999px; transition:width .35s ease}

  .card{background:var(--bg); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 22px 28px; display:flex; flex-direction:column; gap:18px}
  @media (max-width:420px){.card{padding:22px 16px 24px}}
  h1,h2{font-family:var(--head); font-weight:800; color:var(--ink); margin:0; line-height:1.15; letter-spacing:-.015em; text-wrap:balance}
  h1{font-size:clamp(26px,6.4vw,34px)}
  h2{font-size:clamp(21px,5.2vw,27px)}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; align-self:flex-start; font-size:11.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
           color:var(--brand-deep); background:var(--soft); border:1px solid var(--line); padding:6px 13px; border-radius:999px; margin:0}
  .hint{margin:0; color:var(--muted); font-size:14px}
  .sub-q{margin:10px 0 0; font-family:var(--head); font-weight:700; color:var(--ink); font-size:17px; line-height:1.3}

  .hero{border-radius:16px; overflow:hidden; background:var(--soft)}
  .hero img{display:block; width:100%; max-width:100%; aspect-ratio:5/4; object-fit:cover}
  .intro p{margin:0; font-size:16px; color:var(--text)}
  .intro p b{color:var(--ink); font-weight:700}
  .intro{display:flex; flex-direction:column; gap:12px}
  .facts{display:flex; flex-wrap:wrap; gap:8px}
  .fact{font-size:13px; font-weight:600; color:var(--brand-deep); background:var(--soft); border:1px solid var(--line); padding:6px 12px; border-radius:999px}

  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .field label small{font-weight:500; letter-spacing:0; text-transform:none}
  .input{width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-size:16.5px}
  .input::placeholder{color:var(--muted); opacity:.75}
  .input:focus{border-color:var(--petrol); outline:none; box-shadow:0 0 0 4px var(--soft)}
  .withat{position:relative}
  .withat .input{padding-left:38px}
  .withat::before{content:"@"; position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; font-size:16.5px}
  textarea.input{min-height:150px; resize:vertical; line-height:1.55}

  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:14px 16px; border-radius:999px; cursor:pointer;
       border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-weight:600; font-size:15.5px; line-height:1.3;
       transition:border-color .15s, background .15s, transform .08s}
  .opt:hover{border-color:var(--brand)}
  .opt:active{transform:scale(.99)}
  .opt{min-width:0; min-height:64px}
  .opt > span:last-child{min-width:0; hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word; word-break:normal}
  .opt .box{flex:none; width:22px; height:22px; border-radius:7px; border:2px solid var(--line); display:grid; place-items:center; background:var(--bg)}
  .opt.single .box{border-radius:50%}
  .opt .box svg{width:14px; height:14px; opacity:0}
  .opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--petrol); background:var(--soft)}
  .opt[aria-pressed="true"] .box,.opt[aria-checked="true"] .box{background:var(--petrol); border-color:var(--petrol)}
  .opt[aria-pressed="true"] .box svg,.opt[aria-checked="true"] .box svg{opacity:1}
  .grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
  .grid2 .opt{padding:12px 14px; gap:10px; font-size:14.5px; border-radius:16px; min-height:62px}
  @media (max-width:340px){.grid2{grid-template-columns:1fr}}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{padding:10px 18px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-weight:600; cursor:pointer}
  .chip[aria-checked="true"]{background:var(--petrol); border-color:var(--petrol); color:#fff}

  .scale{display:grid; grid-template-columns:repeat(var(--n,11),1fr); gap:5px}
  .scale button{aspect-ratio:1/1.15; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
                font-family:var(--head); font-weight:800; font-size:15px; cursor:pointer; padding:0; display:grid; place-items:center; position:relative; overflow:hidden}
  .scale button::after{content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--lvl)}
  .scale button[aria-checked="true"]{background:var(--lvl); border-color:var(--lvl); color:#fff; transform:scale(1.08); box-shadow:var(--shadow)}
  .scale-legend{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted)}
  .lvl-out{background:var(--soft); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px; min-height:70px}
  .lvl-out .n{font-family:var(--head); font-weight:800; font-size:32px; color:var(--ink); line-height:1; min-width:44px; text-align:center}
  .lvl-out .d{font-size:14.5px; color:var(--text)}
  .lvl-out .d b{color:var(--ink)}
  @media (max-width:400px){.scale{gap:3px} .scale button{font-size:13px; border-radius:7px}}

  .slider{background:var(--soft); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px}
  .slider .val{font-family:var(--head); font-weight:800; font-size:30px; color:var(--ink); line-height:1}
  .slider .val small{font-family:var(--body); font-weight:500; font-size:14px; color:var(--muted); margin-left:6px}
  .slider input[type=range]{width:100%; accent-color:var(--petrol); height:32px; margin:0}
  .slider .ends{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted)}

  .story p{margin:0; font-size:15.5px}
  .story{display:flex; flex-direction:column; gap:10px}
  .story b{color:var(--ink)}
  .proof{display:flex; gap:10px; padding-top:18px; border-top:1px solid var(--line)}
  .proof div{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:2px; text-align:center}
  .proof b{font-family:var(--head); font-weight:800; font-size:20px; color:var(--ink); line-height:1.1}
  .proof span{font-size:11.5px; color:var(--muted); line-height:1.35; min-height:2.7em}
  .tps{display:flex; flex-direction:column; gap:12px}
  .tp{background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow)}
  .tp .who{display:flex; align-items:center; gap:12px}
  .tp .who img{width:52px; height:52px; flex:none; border-radius:50%; object-fit:cover; border:2px solid var(--bg); box-shadow:0 3px 10px rgba(38,64,63,.16)}
  .tp .who-t{display:flex; flex-direction:column; gap:3px; min-width:0}
  .tp .who-t b{font-family:var(--head); font-weight:800; font-size:16px; color:var(--ink); line-height:1.2}
  .tp .stars{color:var(--gold-deep); letter-spacing:1.5px; font-size:13px; line-height:1}
  .tp p{margin:0; font-size:14.5px; color:var(--text)}
  .tp .result{align-self:flex-start; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
              color:var(--brand-deep); background:var(--soft); padding:5px 13px; border-radius:999px}
  .tp .result::before{content:"✓"; font-weight:800}
  .next-up{display:flex; flex-direction:column; gap:4px; background:var(--cream); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:15px; color:var(--text)}
  .next-up .k{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--brand-deep)}
  .pillar-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  .pillar-list li{display:flex; align-items:center; gap:12px; background:var(--soft); border-radius:14px; padding:11px 14px}
  .pillar-list .pn{flex:none; width:26px; height:26px; border-radius:9px; background:var(--petrol); color:#fff;
                   font-family:var(--head); font-weight:800; font-size:13px; display:grid; place-items:center}
  .pillar-list .pt{font-family:var(--head); font-weight:700; font-size:14.5px; color:var(--ink); line-height:1.25; min-width:0; hyphens:auto; -webkit-hyphens:auto}
  .consent{display:flex; gap:12px; align-items:flex-start; background:var(--bg); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; font-size:14px; color:var(--text)}
  .consent input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--petrol); flex:none; cursor:pointer}

  .nav{position:fixed; left:0; right:0; bottom:0; padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
       background:linear-gradient(to top, var(--cream) 72%, rgba(245,242,234,0)); z-index:5}
  .nav-in{position:relative; max-width:640px; margin:0 auto; display:flex; justify-content:center; align-items:center; min-height:56px}
  .btn{appearance:none; border:0; border-radius:999px; padding:17px 24px; font-family:var(--head); font-weight:800; font-size:16.5px; cursor:pointer;
       display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .15s, box-shadow .15s, background .15s, opacity .15s}
  .btn.primary{width:100%; max-width:calc(100% - 112px); background:var(--gold); color:var(--ink); box-shadow:0 10px 26px rgba(219,169,42,.34)}
  @media (max-width:360px){
    .btn{padding-inline:16px; font-size:15.5px}
    .btn.back{width:42px; height:42px}
    .btn.primary{max-width:calc(100% - 100px)}
  }
  .btn.primary:hover:not(:disabled){background:var(--gold-light); transform:translateY(-2px); box-shadow:0 14px 34px rgba(219,169,42,.46)}
  .btn.primary:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  .btn.back{position:absolute; left:0; top:50%; transform:translateY(-50%); width:48px; height:48px; padding:0; border-radius:50%;
            background:var(--bg); border:1.5px solid var(--line); color:var(--petrol); box-shadow:var(--shadow)}
  .btn.back svg{width:20px; height:20px}
  .btn.back:hover{border-color:var(--brand); color:var(--ink)}
  .btn.petrol{background:var(--petrol); color:#fff}
  .nav[hidden]{display:none}

  .done p{margin:0; font-size:16px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

  /* Weiche Trennstellen (U+00AD) in langen Komposita: bricht als "Rücken-schmerzen"
     statt mitten im Wort. Betrifft nur die Anzeige, nicht den gespeicherten Wert. */
  var SOFT_PARTS = ["schmerzen","beschwerden","probleme","verständnis","gesundheit","umstellung",
                    "untersuchungen","einschränkungen","bereitschaft","fähigkeit","erschöpfung",
                    "system","umfeld","patient","keit","heit","ungen"];
  function soft(str){
    return String(str).replace(/[A-Za-zÄÖÜäöüß]{11,}/g, function(w){
      var lw = w.toLowerCase();
      for (var i=0;i<SOFT_PARTS.length;i++){
        var part = SOFT_PARTS[i], ix = lw.lastIndexOf(part);
        if (ix >= 5 && ix + part.length === w.length) return w.slice(0,ix) + "\u00AD" + w.slice(ix);
      }
      return w;
    });
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function bindOptions(){
    stepsEl.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.getAttribute("data-key"), kind = b.getAttribute("data-kind"), val = b.getAttribute("data-val");
        if (kind==="multi"){
          var arr = answers[key] || [];
          var ix = arr.indexOf(val);
          if (ix>=0) arr.splice(ix,1); else arr.push(val);
          answers[key] = arr;
          b.setAttribute("aria-pressed", ix<0);
          var wrap = document.getElementById("tried-other-wrap");
          if (wrap && key==="tried") wrap.hidden = arr.indexOf("Anderes")<0;
        } else {
          answers[key] = val;
          stepsEl.querySelectorAll('.opt[data-key="'+key+'"]').forEach(function(o){ o.setAttribute("aria-checked", o===b); });
        }
        validate(); save();
      });
    });
    var other = document.getElementById("f-other");
    if (other) other.addEventListener("input", function(){ answers[other.getAttribute("data-key")] = other.value; save(); });
  }
  function bindTextareas(){
    stepsEl.querySelectorAll("textarea").forEach(function(ta){
      var key = ta.id.replace(/^f-/,"");
      function upd(){ answers[key] = ta.value; validate(); save(); }
      ta.addEventListener("input", upd); upd();
    });
  }
  function bindRange(id, onChange){
    var r = document.getElementById(id);
    if (r) r.addEventListener("input", function(){ onChange(parseInt(r.value,10), r.value); validate(); save(); });
  }

  function bind(s){
    if (s.kind==="name"){
      var f = document.getElementById("f-first");
      function upd(){ answers.name = {first:f.value, insta:(answers.name||{}).insta||"", gender:(answers.name||{}).gender||""}; validate(); save(); }
      f.addEventListener("input", upd);
      stepsEl.querySelectorAll(".chip").forEach(function(c){
        c.addEventListener("click", function(){
          answers.name = answers.name || {first:f.value, insta:""};
          answers.name.gender = c.getAttribute("data-val");
          stepsEl.querySelectorAll(".chip").forEach(function(o){ o.setAttribute("aria-checked", o===c); });
          validate(); save();
        });
      });
      setTimeout(function(){ f.focus(); }, 50);
    }
    if (["multi","single","job","time","tried","pillar"].indexOf(s.kind)>=0) bindOptions();
    if (s.kind==="text" || s.kind==="tried") bindTextareas();
    if (s.kind==="scale"){
      stepsEl.querySelectorAll(".scale button").forEach(function(b){
        b.addEventListener("click", function(){
          var v = parseInt(b.getAttribute("data-val"),10);
          answers[s.id] = v;
          stepsEl.querySelectorAll(".scale button").forEach(function(o){ o.setAttribute("aria-checked", o===b); });
          document.getElementById("lvl-out").innerHTML = levelOut(s, v);
          validate(); save();
        });
      });
    }
    if (s.kind==="job"){
      var j = document.getElementById("f-job");
      j.addEventListener("input", function(){ answers.job = j.value; validate(); save(); });
    }
    if (s.kind==="time") bindRange("f-minutes", function(v, raw){ answers.minutes = v; document.getElementById("min-val").textContent = raw; document.getElementById("min-hint").textContent = ""; });
    if (s.kind==="pillar") bindRange("f-slider", function(v, raw){ answers[s.id+"_skala"] = v; document.getElementById("sl-val").textContent = raw; document.getElementById("sl-hint").textContent = ""; });
    if (s.kind==="contact"){
      var e = document.getElementById("f-email"), p = document.getElementById("f-phone"), k = document.getElementById("f-consent");
      function updc(){ answers.contact = {email:e.value.trim(), phone:p.value.trim(), consent:k.checked}; validate(); save(); }
      e.addEventListener("input", updc); p.addEventListener("input", updc); k.addEventListener("change", updc);
    }
  }

  function valid(s){
    var a = answers;
    switch (s.kind){
      case "intro": case "done": case "story": case "pillars": return true;
      case "name": return !!(a.name && a.name.first.trim().length>=2 && a.name.gender);
      case "multi": return (a[s.id]||[]).length>0;
      case "single": return !!a[s.id];
      case "scale": return typeof a[s.id]==="number";
      case "text": return (a[s.id]||"").trim().length>0;
      case "tried": return (a.tried||[]).length>0 && (a.triedReflect||"").trim().length>0;
      case "job": return (a.job||"").trim().length>=2 && !!a.hours;
      case "time": return !!a.treatment && typeof a.minutes==="number";
      case "pillar": return !!a[s.id+"_1"] && !!a[s.id+"_2"] && typeof a[s.id+"_skala"]==="number";
      case "contact": return !!(a.contact && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(a.contact.email) && a.contact.consent);
    }
    return true;
  }
  function validate(){ nextBtn.disabled = !valid(STEPS[step]); }

  nextBtn.addEventListener("click", function(){ if (!valid(STEPS[step])) return; step = Math.min(step+1, STEPS.length-1); render(); });
  backBtn.addEventListener("click", function(){ step = Math.max(step-1, 0); render(); });

      "Stärke: "+lvlText("level", PAIN_LEVELS),
      "Bisher probiert: "+((answers.tried||[]).join(", "))+(answers.triedOther ? " – "+answers.triedOther : ""),
      "Woran gescheitert: "+((answers.blocked||[]).join("; ")),
      "Veränderungswunsch: "+lvlText("change", CHANGE_LEVELS),
      "Beruf: "+(answers.job||"")+" · "+(answers.hours||""),
      "Behandlung: "+(answers.treatment||"")+" · Zeit: "+(typeof answers.minutes==="number" ? answers.minutes+" Min/Tag" : ""),
      "Ziel bis: "+(answers.deadline||""),
      "7 Säulen:",
      PILLAR_STEPS.map(function(p){ return "  "+p.name+": "+(answers[p.id+"_1"]||"–")+" | "+(answers[p.id+"_2"]||"–")+" | Skala "+(typeof answers[p.id+"_skala"]==="number" ? answers[p.id+"_skala"]+"/10" : "–"); }).join("\n"),
      "Investition: "+(answers.invest||""),
      "",
      "Was hat wirklich geholfen:",
      (answers.triedReflect||""),
      "",
      "Das Erste ohne Beschwerden:",
      (answers.future||"")
    ].join("\n");
  }

  function payload(){
    var n = answers.name || {}, c = answers.contact || {};
    var out = {
      vorname: n.first||"", instagram: n.insta||"", geschlecht: n.gender||"",
      email: c.email||"", telefon: c.phone||"", bestaetigung: c.consent ? "ja" : "nein",
      symptome: (answers.symptoms||[]).join(", "), symptome_sonstiges: answers.symptomsOther||"",
      seit: answers.since||"", schmerzstufe: typeof answers.level==="number" ? answers.level : "",
      bisher_probiert: (answers.tried||[]).join(", "), bisher_probiert_sonstiges: answers.triedOther||"",
      was_geholfen: answers.triedReflect||"", woran_gescheitert: (answers.blocked||[]).join("; "),
      veraenderungswunsch: typeof answers.change==="number" ? answers.change : "",
      beruf: answers.job||"", arbeitszeit: answers.hours||"",
      erstes_ohne_beschwerden: answers.future||"",
      in_behandlung: answers.treatment||"", minuten_pro_tag: typeof answers.minutes==="number" ? answers.minutes : "",
      ziel_bis: answers.deadline||"",
      investition: answers.invest||"",
      contact_id: LINK.contact_id||"", link_instagram: LINK.instagram||"",
      zeitpunkt: new Date().toISOString(), quelle: "Instagram Opener", zusammenfassung: summaryText()
    };
    PILLAR_STEPS.forEach(function(p){
      out[p.id+"_frage1"] = answers[p.id+"_1"]||""; out[p.id+"_frage2"] = answers[p.id+"_2"]||"";
      out[p.id+"_skala"] = typeof answers[p.id+"_skala"]==="number" ? answers[p.id+"_skala"] : "";
    });
    return out;
  }

  /* Versand läuft still im Hintergrund – die Danke-Seite zeigt keinen Status. */
  function submit(){
    function clear(){ try { localStorage.removeItem("mbm-check-v3"); } catch(e){} }
    if (!CONFIG.webhookUrl){ clear(); return; }
    var body = JSON.stringify(payload());
    fetch(CONFIG.webhookUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:body, mode:"cors" })
      .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); })
      .catch(function(){
        /* Zweiter Versuch ohne CORS-Preflight: Antwort nicht lesbar, Request kommt aber an. */
        return fetch(CONFIG.webhookUrl, { method:"POST", headers:{"Content-Type":"text/plain"}, body:body, mode:"no-cors" });
      })
      .then(clear, clear);
  }

  render();
})();
</script>

</body>
</html>
