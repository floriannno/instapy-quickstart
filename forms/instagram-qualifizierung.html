<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Schmerzfrei-Check</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap">
<style>
  :root{
    --ground:#F2F7F7; --card:#FFFFFF; --card-2:#E9F1F2; --line:#D3E1E3; --line-2:#B9CDD0;
    --ink:#0B2126; --body:#274449; --muted:#5F7B80;
    --teal:#0F4A54; --teal-ink:#FFFFFF; --teal-soft:#DCEBED;
    --accent:#F4C21B; --accent-ink:#0B2126; --accent-soft:#FFF3C7;
    --ok:#2E8B6A; --warn:#D68B2A; --bad:#C9553F;
    --shadow:0 10px 30px rgba(11,33,38,.08);
    --serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0B2126; --card:#12333A; --card-2:#17414A; --line:#20505B; --line-2:#2E6270;
      --ink:#EEF5F6; --body:#CBDCDF; --muted:#8AA8AE;
      --teal:#1F6A78; --teal-ink:#FFFFFF; --teal-soft:#17414A;
      --accent:#F4C21B; --accent-ink:#0B2126; --accent-soft:#3A3410;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B2126; --card:#12333A; --card-2:#17414A; --line:#20505B; --line-2:#2E6270;
    --ink:#EEF5F6; --body:#CBDCDF; --muted:#8AA8AE;
    --teal:#1F6A78; --teal-ink:#FFFFFF; --teal-soft:#17414A;
    --accent:#F4C21B; --accent-ink:#0B2126; --accent-soft:#3A3410;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--ground); color:var(--body); font-family:var(--sans);
       font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit; color:inherit}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  .app{max-width:600px; margin:0 auto; padding:0 16px; padding-block:18px 120px; display:flex; flex-direction:column; gap:22px}

  .top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; color:var(--ink); font-size:14px; letter-spacing:.02em}
  .brand .mark{width:30px; height:30px; border-radius:50%; background:var(--teal); color:var(--teal-ink);
               display:grid; place-items:center; font-family:var(--serif); font-size:16px}
  .stepinfo{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .progress{height:6px; border-radius:999px; background:var(--card-2); overflow:hidden}
  .progress > span{display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .35s ease}

  .dom{display:flex; gap:12px; align-items:flex-start}
  .dom img{width:56px; height:56px; border-radius:50%; object-fit:cover; flex:none; border:3px solid var(--card); box-shadow:var(--shadow)}
  .bubble{position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px; border-top-left-radius:4px;
          padding:12px 16px; font-size:15px; color:var(--body); flex:1 1 auto}
  .bubble .who{display:block; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); margin-bottom:3px}

  .step{display:flex; flex-direction:column; gap:18px}
  h1,h2,h3{font-family:var(--serif); font-weight:700; color:var(--ink); margin:0; line-height:1.15; text-wrap:balance}
  h1{font-size:clamp(28px,7vw,38px)}
  h2{font-size:clamp(23px,5.6vw,30px)}
  h3{font-size:19px}
  .hint{margin:0; color:var(--muted); font-size:14.5px}
  .sub-q{margin:8px 0 0; font-weight:600; color:var(--ink); font-size:17px}

  .hero{position:relative; border-radius:20px; overflow:hidden; background:var(--card-2); box-shadow:var(--shadow)}
  .hero img{display:block; width:100%; max-width:100%; aspect-ratio:4/3; object-fit:cover}
  .hero .tag{position:absolute; left:14px; bottom:14px; background:var(--accent); color:var(--accent-ink); font-weight:700;
             font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 11px; border-radius:999px}
  .intro-copy{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 20px 18px; display:flex; flex-direction:column; gap:12px}
  .intro-copy p{margin:0; color:var(--body); font-size:16px}
  .intro-copy .sig{font-family:var(--serif); font-size:20px; color:var(--ink)}
  .facts{display:flex; flex-wrap:wrap; gap:8px}
  .fact{font-size:13px; font-weight:600; color:var(--teal); background:var(--teal-soft); padding:6px 11px; border-radius:999px}

  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .field label small{font-weight:500; letter-spacing:0; text-transform:none}
  .input{width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line-2); background:var(--card); color:var(--ink); font-size:17px}
  .input::placeholder{color:var(--muted); opacity:.8}
  .input:focus{border-color:var(--teal); outline:none; box-shadow:0 0 0 4px var(--teal-soft)}
  .withat{position:relative}
  .withat .input{padding-left:38px}
  .withat::before{content:"@"; position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; font-size:17px}
  textarea.input{min-height:160px; resize:vertical; line-height:1.55}
  .count{display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .count .ok{color:var(--ok); font-weight:600}
  .count .todo{color:var(--warn); font-weight:600}

  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; border-radius:14px; cursor:pointer;
       border:1.5px solid var(--line-2); background:var(--card); color:var(--ink); transition:border-color .15s, background .15s, transform .08s}
  .opt:hover{border-color:var(--teal)}
  .opt:active{transform:scale(.99)}
  .opt .box{flex:none; width:22px; height:22px; border-radius:7px; border:2px solid var(--line-2); display:grid; place-items:center; background:var(--card)}
  .opt.single .box{border-radius:50%}
  .opt .box svg{width:14px; height:14px; opacity:0}
  .opt .txt{display:flex; flex-direction:column; gap:2px; min-width:0}
  .opt .t{font-weight:600; font-size:16.5px}
  .opt .s{font-size:13.5px; color:var(--muted)}
  .opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .opt[aria-pressed="true"] .box,.opt[aria-checked="true"] .box{background:var(--accent); border-color:var(--accent)}
  .opt[aria-pressed="true"] .box svg,.opt[aria-checked="true"] .box svg{opacity:1}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid2 .opt{padding:12px 13px; gap:10px}
  .grid2 .opt .t{font-size:15.5px}
  .grid2 .opt .s{font-size:12.5px}
  @media (max-width:340px){.grid2{grid-template-columns:1fr}}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{padding:10px 16px; border-radius:999px; border:1.5px solid var(--line-2); background:var(--card); color:var(--ink); font-weight:600; cursor:pointer}
  .chip[aria-checked="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

  .scale{display:grid; grid-template-columns:repeat(var(--n,11),1fr); gap:5px}
  .scale button{aspect-ratio:1/1.15; border-radius:10px; border:1.5px solid var(--line-2); background:var(--card); color:var(--ink);
                font-weight:700; font-size:15px; cursor:pointer; padding:0; display:grid; place-items:center; position:relative; overflow:hidden}
  .scale button::after{content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--lvl)}
  .scale button[aria-checked="true"]{background:var(--lvl); border-color:var(--lvl); color:#fff; transform:scale(1.08); box-shadow:var(--shadow)}
  .scale-legend{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted)}
  .lvl-out{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px; min-height:74px}
  .lvl-out .n{font-family:var(--serif); font-size:34px; color:var(--ink); line-height:1; min-width:44px; text-align:center}
  .lvl-out .d{font-size:15px; color:var(--body)}
  .lvl-out .d b{color:var(--ink)}
  @media (max-width:400px){.scale{gap:3px} .scale button{font-size:13px; border-radius:7px}}

  .slider{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
  .slider .val{font-family:var(--serif); font-size:30px; color:var(--ink); line-height:1}
  .slider .val small{font-family:var(--sans); font-size:14px; color:var(--muted); margin-left:6px}
  .slider input[type=range]{width:100%; accent-color:var(--accent); height:32px; margin:0}
  .slider .ends{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted)}

  .pillars{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media (max-width:420px){.pillars{grid-template-columns:1fr}}
  .pillar{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 15px; display:flex; flex-direction:column; gap:4px}
  .pillar .k{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--teal)}
  .pillar .t{font-weight:700; color:var(--ink); font-size:16px}
  .pillar .s{font-size:13.5px; color:var(--muted)}
  .proof{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  @media (max-width:340px){.proof{grid-template-columns:1fr}}
  @media (max-width:420px){.proof .n{font-size:22px} .proof .l{font-size:11.5px} .proof div{padding:12px 8px}}
  .proof div{background:var(--teal); color:var(--teal-ink); border-radius:14px; padding:14px 12px; text-align:center}
  .proof .n{font-family:var(--serif); font-size:26px; line-height:1.05}
  .proof .l{font-size:12.5px; opacity:.85; margin-top:4px}
  .info-text{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; display:flex; flex-direction:column; gap:10px}
  .info-text p{margin:0}

  .consent{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1.5px solid var(--line-2); border-radius:14px; padding:14px 16px; cursor:pointer; font-size:14.5px; color:var(--body)}
  .consent input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--accent); flex:none; cursor:pointer}

  .nav{position:fixed; left:0; right:0; bottom:0; padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
       background:linear-gradient(to top, var(--ground) 70%, transparent); z-index:5}
  .nav-in{max-width:600px; margin:0 auto; display:flex; gap:10px; align-items:center}
  .btn{appearance:none; border:0; border-radius:14px; padding:16px 22px; font-weight:700; font-size:17px; cursor:pointer;
       display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:filter .15s, opacity .15s}
  .btn.primary{flex:1; background:var(--accent); color:var(--accent-ink); box-shadow:0 8px 24px rgba(244,194,27,.28)}
  .btn.primary:hover:not(:disabled){filter:brightness(1.06)}
  .btn.primary:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  .btn.ghost{background:transparent; color:var(--muted); padding-inline:14px}
  .btn.ghost:hover{color:var(--ink)}
  .btn.teal{background:var(--teal); color:var(--teal-ink)}
  .nav[hidden]{display:none}

  .done-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow)}
  .done-card p{margin:0}
  .summary{background:var(--card-2); border-radius:12px; padding:14px 16px; font-size:14px; white-space:pre-wrap; color:var(--body); max-height:260px; overflow:auto}
  .toast{font-size:13.5px; color:var(--ok); font-weight:600; min-height:18px}

  .foot{font-size:12.5px; color:var(--muted); text-align:center; margin:0}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="app" id="app">
  <div class="top">
    <div class="brand"><span class="mark">M</span>MyBodyMind</div>
    <div class="stepinfo" id="stepinfo"></div>
  </div>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>

  <div id="steps"></div>

  <p class="foot">Deine Antworten sind vertraulich und gehen nur an Dominik und sein Team.</p>
</div>

<div class="nav" id="nav">
  <div class="nav-in">
    <button class="btn ghost" id="back" type="button">Zurück</button>
    <button class="btn primary" id="next" type="button">Weiter</button>
  </div>
</div>

  function bindOptions(){
    stepsEl.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.getAttribute("data-key"), kind = b.getAttribute("data-kind"), val = b.getAttribute("data-val");
        if (kind==="multi"){
          var arr = answers[key] || [];
          var ix = arr.indexOf(val);
          if (ix>=0) arr.splice(ix,1); else arr.push(val);
          answers[key] = arr;
          b.setAttribute("aria-pressed", ix<0);
          var wrap = document.getElementById("tried-other-wrap");
          if (wrap && key==="tried") wrap.hidden = arr.indexOf("Anderes")<0;
        } else {
          answers[key] = val;
          stepsEl.querySelectorAll('.opt[data-key="'+key+'"]').forEach(function(o){ o.setAttribute("aria-checked", o===b); });
        }
        validate(); save();
      });
    });
    var other = document.getElementById("f-other");
    if (other) other.addEventListener("input", function(){ answers[other.getAttribute("data-key")] = other.value; save(); });
  }
  function bindTextareas(){
    stepsEl.querySelectorAll("textarea").forEach(function(ta){
      var key = ta.id.replace(/^f-/,"");
      function upd(){ answers[key] = ta.value; validate(); save(); }
      ta.addEventListener("input", upd); upd();
    });
  }

  function bind(s){
    if (s.kind==="name"){
      var f = document.getElementById("f-first"), g = document.getElementById("f-insta");
      function upd(){ answers.name = {first:f.value, insta:g.value.replace(/^@/,""), gender:(answers.name||{}).gender||""}; validate(); save(); }
      f.addEventListener("input", upd); g.addEventListener("input", upd);
      stepsEl.querySelectorAll(".chip").forEach(function(c){
        c.addEventListener("click", function(){
          answers.name = answers.name || {first:f.value, insta:g.value};
          answers.name.gender = c.getAttribute("data-val");
          stepsEl.querySelectorAll(".chip").forEach(function(o){ o.setAttribute("aria-checked", o===c); });
          validate(); save();
        });
      });
      setTimeout(function(){ f.focus(); }, 50);
    }
    if (s.kind==="multi" || s.kind==="single" || s.kind==="job" || s.kind==="time" || s.kind==="tried") bindOptions();
    if (s.kind==="text" || s.kind==="tried") bindTextareas();
    if (s.kind==="scale"){
      stepsEl.querySelectorAll(".scale button").forEach(function(b){
        b.addEventListener("click", function(){
          var v = parseInt(b.getAttribute("data-val"),10);
          answers[s.id] = v;
          stepsEl.querySelectorAll(".scale button").forEach(function(o){ o.setAttribute("aria-checked", o===b); });
          document.getElementById("lvl-out").innerHTML = levelOut(s, v);
          validate(); save();
        });
      });
    }
    if (s.kind==="job"){
      var j = document.getElementById("f-job");
      j.addEventListener("input", function(){ answers.job = j.value; validate(); save(); });
    }
    if (s.kind==="time"){
      var r = document.getElementById("f-minutes");
      r.addEventListener("input", function(){
        answers.minutes = parseInt(r.value,10);
        document.getElementById("min-val").textContent = r.value;
        document.getElementById("min-hint").textContent = "";
        validate(); save();
      });
    }
    if (s.kind==="contact"){
      var e = document.getElementById("f-email"), p = document.getElementById("f-phone"), k = document.getElementById("f-consent");
      function updc(){ answers.contact = {email:e.value.trim(), phone:p.value.trim(), consent:k.checked}; validate(); save(); }
      e.addEventListener("input", updc); p.addEventListener("input", updc); k.addEventListener("change", updc);
    }
  }

  function valid(s){
    var a = answers;
    switch (s.kind){
      case "intro": case "done": case "about": return true;
      case "name": return !!(a.name && a.name.first.trim().length>=2 && a.name.insta.trim().length>=2 && a.name.gender);
      case "multi": return (a[s.id]||[]).length>0;
      case "single": return !!a[s.id];
      case "scale": return typeof a[s.id]==="number";
      case "text": return (a[s.id]||"").trim().length>0;
      case "tried": return (a.tried||[]).length>0 && (a.triedReflect||"").trim().length>0;
      case "job": return (a.job||"").trim().length>=2 && !!a.hours;
      case "time": return !!a.treatment && typeof a.minutes==="number";
      case "contact": return !!(a.contact && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(a.contact.email) && a.contact.consent);
    }
    return true;
  }
  function validate(){ nextBtn.disabled = !valid(STEPS[step]); }

  nextBtn.addEventListener("click", function(){ if (!valid(STEPS[step])) return; step = Math.min(step+1, STEPS.length-1); render(); });
  backBtn.addEventListener("click", function(){ step = Math.max(step-1, 0); render(); });

  function lvlText(key, levels){ var v = answers[key]; return typeof v==="number" ? v+"/10 ("+levels[v][0]+")" : ""; }
  function summaryText(){
    var n = answers.name || {}, c = answers.contact || {};
    return [
      "Schmerzfrei-Check – "+(n.first||"")+" (@"+(n.insta||"")+", "+(n.gender||"")+")",
      "E-Mail: "+(c.email||"")+(c.phone ? " · Tel: "+c.phone : ""),
      "Symptome: "+((answers.symptoms||[]).join(", "))+(answers.symptomsOther ? " – "+answers.symptomsOther : ""),
      "Seit: "+(answers.since||""),
      "Stärke: "+lvlText("level", PAIN_LEVELS),
      "Bisher probiert: "+((answers.tried||[]).join(", "))+(answers.triedOther ? " – "+answers.triedOther : ""),
      "Woran gescheitert: "+((answers.blocked||[]).join("; ")),
      "Veränderungswunsch: "+lvlText("change", CHANGE_LEVELS),
      "Beruf: "+(answers.job||"")+" · "+(answers.hours||""),
      "Behandlung: "+(answers.treatment||"")+" · Zeit: "+(typeof answers.minutes==="number" ? answers.minutes+" Min/Tag" : ""),
      "Ziel bis: "+(answers.deadline||""),
      "Investition: "+(answers.invest||""),
      "",
      "Was hat wirklich geholfen:",
      (answers.triedReflect||""),
      "",
      "Das Erste ohne Beschwerden:",
      (answers.future||"")
    ].join("\n");
  }

  function payload(){
    var n = answers.name || {}, c = answers.contact || {};
    return {
      vorname: n.first||"", instagram: n.insta||"", geschlecht: n.gender||"",
      email: c.email||"", telefon: c.phone||"", bestaetigung: c.consent ? "ja" : "nein",
      symptome: (answers.symptoms||[]).join(", "), symptome_sonstiges: answers.symptomsOther||"",
      seit: answers.since||"", schmerzstufe: typeof answers.level==="number" ? answers.level : "",
      bisher_probiert: (answers.tried||[]).join(", "), bisher_probiert_sonstiges: answers.triedOther||"",
      was_geholfen: answers.triedReflect||"", woran_gescheitert: (answers.blocked||[]).join("; "),
      veraenderungswunsch: typeof answers.change==="number" ? answers.change : "",
      beruf: answers.job||"", arbeitszeit: answers.hours||"",
      erstes_ohne_beschwerden: answers.future||"",
      in_behandlung: answers.treatment||"", minuten_pro_tag: typeof answers.minutes==="number" ? answers.minutes : "",
      ziel_bis: answers.deadline||"", investition: answers.invest||"",
      zeitpunkt: new Date().toISOString(), quelle: "Instagram Opener", zusammenfassung: summaryText()
    };
  }

  function showFallback(msg){
    var card = document.getElementById("done-card");
    if (!card) return;
    var dm = CONFIG.instagramHandle ? 'https://ig.me/m/'+encodeURIComponent(CONFIG.instagramHandle) : "";
    card.innerHTML = '<p>'+esc(msg)+'</p>'
      + '<p><b>Kopiere bitte deine Antworten und schick sie mir als Instagram-Nachricht</b> – dann kann ich direkt darauf eingehen.</p>'
      + '<div class="summary" id="sum">'+esc(summaryText())+'</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn teal" id="copy" type="button">Antworten kopieren</button>'
      + (dm ? '<a class="btn primary" style="text-decoration:none" href="'+dm+'" target="_blank" rel="noopener">Instagram-DM öffnen</a>' : '')+'</div>'
      + '<div class="toast" id="toast"></div>';
    document.getElementById("copy").addEventListener("click", function(){
      var txt = summaryText();
      function ok(){ document.getElementById("toast").textContent = "Kopiert – jetzt einfach in die DM einfügen."; }
      function selectSum(){ var r=document.createRange(); r.selectNodeContents(document.getElementById("sum")); var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r); document.getElementById("toast").textContent="Text markiert – jetzt kopieren."; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, selectSum);
      else selectSum();
    });
  }

  function submit(){
    var state = document.getElementById("send-state");
    function clear(){ try { localStorage.removeItem("mbm-check-v2"); } catch(e){} }
    if (!CONFIG.webhookUrl){ showFallback("Fast geschafft – ein letzter Schritt:"); clear(); return; }
    var body = JSON.stringify(payload());
    fetch(CONFIG.webhookUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:body, mode:"cors" })
      .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); done(); })
      .catch(function(){
        /* Fallback ohne CORS-Preflight: Antwort ist dann nicht lesbar, der Request kommt aber an. */
        return fetch(CONFIG.webhookUrl, { method:"POST", headers:{"Content-Type":"text/plain"}, body:body, mode:"no-cors" }).then(done, function(){
          showFallback("Die automatische Übermittlung hat leider nicht geklappt.");
        });
      });
    function done(){
      if (state) state.innerHTML = '<span style="color:var(--ok);font-weight:600">Deine Antworten sind angekommen. Bis gleich in deinen DMs!</span>';
      clear();
    }
  }

  render();
})();
</script>

</body>
</html>
